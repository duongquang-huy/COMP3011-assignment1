<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #5b21b6, transparent 40%),
                radial-gradient(circle at bottom right, #7e22ce, transparent 40%),
                #090014;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 50px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(139, 92, 246, 0.2);

            backdrop-filter: blur(15px);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #c084fc, #a855f7, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #b8a9c9;
            font-size: 17px;
            margin-bottom: 40px;
        }

        #recordBtn {
            width: 280px;
            height: 75px;

            border: none;
            border-radius: 18px;

            font-size: 21px;
            font-weight: bold;
            color: white;

            cursor: pointer;

            background: linear-gradient(135deg, #9333ea, #7c3aed);

            box-shadow:
                0 10px 30px rgba(124, 58, 237, 0.45);

            transition: all 0.25s ease;
        }

        #recordBtn:hover {
            transform: translateY(-3px) scale(1.02);

            box-shadow:
                0 15px 40px rgba(168, 85, 247, 0.6);
        }

        #recordBtn:active {
            transform: scale(0.97);
        }

        #recordBtn.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);

            box-shadow:
                0 0 0 0 rgba(239, 68, 68, 0.7);

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        #status {
            margin: 30px 0 20px;
            font-size: 16px;
            color: #c4b5fd;
        }

        .result-container {
            margin-top: 25px;
            text-align: left;
        }

        .result-title {
            color: #d8b4fe;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #result {
            min-height: 120px;
            padding: 20px;

            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 15px;

            color: #e9d5ff;
            font-size: 17px;
            line-height: 1.6;

            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 32px;
            }

            #recordBtn {
                width: 100%;
                height: 70px;
            }
        }
    </style>
</head>

<body>
	<div style="position: fixed; top: 15px; right: 20px; color: rgba(255,255,255,0.4); font-size: 13px; text-align: right;">
	    COMP3011 Assignment 1
	</div>

    <div class="container">

        <h1>🎙️ Speech to Text</h1>

        <p class="subtitle">
            Record your voice and convert it into text
        </p>

        <button id="recordBtn">
            🎤 Start Recording
        </button>

        <div id="status">
            Click the button to start recording
        </div>

        <div class="result-container">

            <div class="result-title">
                TRANSCRIPTION
            </div>

            <div id="result">
                Transcription will appear here...
            </div>

        </div>

    </div>
	
	<div style="position: fixed; bottom: 15px; right: 20px; color: rgba(255,255,255,0.4); font-size: 13px;">
	    Developed by Duong Quang Huy
	</div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        recordBtn.addEventListener('click', async () => {

            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }

        });

        async function startRecording() {

            try {

                // Request microphone access
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                mediaRecorder = new MediaRecorder(stream);

                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    await uploadAudio();
                };

                mediaRecorder.start();

                isRecording = true;

                // Update UI
                recordBtn.textContent = '⏹ Stop Recording';

                recordBtn.classList.add('recording');

                status.textContent =
                    '🔴 Recording... Click to stop';

                result.textContent =
                    'Listening to your voice...';

            } catch (error) {

                status.textContent =
                    '❌ Error: ' + error.message;

            }

        }

        function stopRecording() {

            mediaRecorder.stop();

            mediaRecorder.stream
                .getTracks()
                .forEach(track => track.stop());

            isRecording = false;

            // Update UI
            recordBtn.textContent =
                '▶ Start Recording';

            recordBtn.classList.remove('recording');

            status.textContent =
                '⏳ Processing...';

        }

        async function uploadAudio() {

            try {

                const audioBlob =
                    new Blob(audioChunks, {
                        type: 'audio/webm'
                    });

                const formData = new FormData();

                formData.append(
                    'audio',
                    audioBlob,
                    'recording.webm'
                );

                // Upload to backend
                const response = await fetch(
                    '/api/v1/transcribe',
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                if (response.ok) {

                    const data =
                        await response.json();

                    result.textContent = data.text;

                    status.textContent =
                        '✅ Transcription completed';

                } else {

                    result.textContent =
                        '💥 Error: ' + response.status;

                    status.textContent =
                        '💥 Transcription failed';

                }

            } catch (error) {

                status.textContent =
                    '❌ Error: ' + error.message;

            }

        }
    </script>

</body>

</html>
